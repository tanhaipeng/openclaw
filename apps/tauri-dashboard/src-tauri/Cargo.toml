[package]
name = "openclaw-dashboard"
version = "0.1.0"
description = "Tauri client for OpenClaw dashboard"
edition = "2021"
rust-version = "1.70"

[lib]
name = "openclaw_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
url = "2"
